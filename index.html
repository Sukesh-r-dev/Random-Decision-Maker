<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Decision Maker</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #1e1e2e; color: #cdd6f4; display: flex; justify-content: center; padding: 20px; margin: 0; min-height: 100vh; }
    .container { display: flex; flex-wrap: wrap; gap: 30px; max-width: 900px; width: 100%; justify-content: center; }
    .card { background: #313244; padding: 20px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); flex: 1; min-width: 300px; }
    
    /* Wheel Styles */
    .wheel-container { position: relative; width: 300px; height: 300px; margin: 0 auto 20px; }
    #canvas { width: 100%; height: 100%; border-radius: 50%; border: 5px solid #cba6f7; }
    .pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; 
               border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 25px solid #f38ba8; z-index: 10; }
    
    /* Inputs & Buttons */
    textarea { width: 100%; height: 120px; background: #181825; color: #cdd6f4; border: 1px solid #45475a; 
               border-radius: 8px; padding: 10px; resize: none; margin-bottom: 10px; }
    button { background: #cba6f7; color: #11111b; border: none; padding: 12px 20px; font-weight: bold; 
             border-radius: 8px; cursor: pointer; width: 100%; transition: 0.2s; }
    button:hover { background: #b4befe; }
    
    /* Result Display */
    #result { text-align: center; font-size: 1.5rem; font-weight: bold; color: #a6e3a1; margin-top: 15px; min-height: 36px; }
    
    /* History List */
    ul { list-style: none; padding: 0; margin: 0; max-height: 150px; overflow-y: auto; }
    li { background: #181825; padding: 8px 12px; margin-bottom: 6px; border-radius: 6px; font-size: 0.9rem; }
  </style>
</head>
<body>

<div class="container">
  <!-- Left Side: Wheel Display -->
  <div class="card" style="text-align: center;">
    <h2>Spin the Wheel</h2>
    <div class="wheel-container">
      <div class="pointer"></div>
      <canvas id="canvas" width="300" height="300"></canvas>
    </div>
    <button id="spin-btn" onclick="spinWheel()">SPIN!</button>
    <div id="result"></div>
  </div>

  <!-- Right Side: Options & History -->
  <div class="card">
    <h2>Your Options</h2>
    <p style="font-size: 0.85rem; color: #a6adc8;">Enter choices (one per line):</p>
    <textarea id="options-input" oninput="drawWheel()">Pizza&#10;Burger&#10;Sushi&#10;Tacos&#10;Pasta</textarea>
    
    <h3>Decision History</h3>
    <ul id="history-list"></ul>
  </div>
</div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const colors = ['#f38ba8', '#fab387', '#f9e2af', '#a6e3a1', '#94e2d5', '#89b4fa', '#cba6f7'];
  let isSpinning = false;
  let currentAngle = 0;

  // Load saved options or set defaults
  window.onload = () => {
    const saved = localStorage.getItem('decision_options');
    if (saved) document.getElementById('options-input').value = saved;
    drawWheel();
  };

  function getOptions() {
    const text = document.getElementById('options-input').value;
    localStorage.setItem('decision_options', text); // Save to LocalStorage
    return text.split('\n').map(o => o.trim()).filter(o => o.length > 0);
  }

  function drawWheel() {
    const options = getOptions();
    const numOptions = options.length;
    const arcSize = (2 * Math.PI) / (numOptions || 1);
    
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (numOptions === 0) return;

    options.forEach((opt, i) => {
      const angle = currentAngle + i * arcSize;
      
      // Draw slice
      ctx.beginPath();
      ctx.fillStyle = colors[i % colors.length];
      ctx.moveTo(150, 150);
      ctx.arc(150, 150, 150, angle, angle + arcSize);
      ctx.fill();

      // Draw text
      ctx.save();
      ctx.translate(150, 150);
      ctx.rotate(angle + arcSize / 2);
      ctx.textAlign = "right";
      ctx.fillStyle = "#11111b";
      ctx.font = "bold 14px sans-serif";
      ctx.fillText(opt.length > 12 ? opt.substring(0, 10) + '...' : opt, 130, 5);
      ctx.restore();
    });
  }

  function spinWheel() {
    const options = getOptions();
    if (options.length < 2 || isSpinning) return;

    isSpinning = true;
    document.getElementById('result').innerText = '';
    
    const spinDegrees = Math.floor(Math.random() * 360) + 1440; // At least 4 full spins
    const duration = 3000; // 3 seconds
    const start = performance.now();

    function animate(now) {
      const elapsed = now - start;
      const progress = Math.min(elapsed / duration, 1);
      
      // Ease-out cubic animation formula
      const easeOut = 1 - Math.pow(1 - progress, 3);
      currentAngle = (easeOut * (spinDegrees * Math.PI / 180));
      
      drawWheel();

      if (progress < 1) {
        requestAnimationFrame(animate);
      } else {
        isSpinning = false;
        calculateWinner(options);
      }
    }

    requestAnimationFrame(animate);
  }

  function calculateWinner(options) {
    const numOptions = options.length;
    const arcSize = (2 * Math.PI) / numOptions;
    
    // Normalize rotation angle
    let normalizedAngle = (3 * Math.PI / 2 - currentAngle) % (2 * Math.PI);
    if (normalizedAngle < 0) normalizedAngle += 2 * Math.PI;

    const winnerIndex = Math.floor(normalizedAngle / arcSize);
    const winner = options[winnerIndex];

    document.getElementById('result').innerText = `🎉 ${winner}`;
    
    // Add to history list
    const historyList = document.getElementById('history-list');
    const li = document.createElement('li');
    li.innerText = `${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})} - ${winner}`;
    historyList.prepend(li);
  }
</script>

</body>
</html>
